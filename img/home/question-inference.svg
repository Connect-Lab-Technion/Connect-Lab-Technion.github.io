<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Inferring a directed weighted graph from measured trajectories</title>
  <desc id="desc">Four measured output trajectories enter a system-identification black box and produce an estimated directed graph with weighted edges.</desc>
  <defs>
    <marker id="orangeHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d06952"/></marker>
    <marker id="blueHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#40546b"/></marker>
    <style>.axis{stroke:#aab8c1;stroke-width:1.5}.signal{fill:none;stroke-width:4;stroke-linecap:round}.flow{stroke:#d06952;stroke-width:4;marker-end:url(#orangeHead)}.box{fill:#132641}.box-title{fill:#fff;font:700 21px Arial,sans-serif;letter-spacing:1px}.box-note{fill:#9ac9dc;font:14px Arial,sans-serif}.edge{fill:none;stroke:#40546b;stroke-width:3;marker-end:url(#blueHead)}.weak{stroke-width:1.8;stroke-dasharray:5 4}.node{fill:#fff;stroke:#132641;stroke-width:4}.leader{fill:#d06952;stroke:#fff;stroke-width:3}.label{fill:#1b5e8f;font:700 16px Arial,sans-serif;letter-spacing:1px}.math{fill:#617082;font:italic 14px Georgia,serif}.weight{fill:#40546b;font:italic 13px Georgia,serif}</style>
  </defs>
  <text class="label" x="112" y="34" text-anchor="middle">MEASURED OUTPUTS</text>
  <path class="axis" d="M20 224h200M20 60v164"/>
  <path class="signal" stroke="#1b5e8f" d="M24 188c26-69 55-95 86-47s58 47 105-36"/><path class="signal" stroke="#d06952" d="M24 154c31 31 63-82 99-28s57 50 92-31"/><path class="signal" stroke="#7f9b61" d="M24 204c39-16 55-84 88-38s57-4 103-76"/><path class="signal" stroke="#8c6aa6" d="M24 179c42 18 56-65 94-20s60-20 97-47"/>
  <text class="math" x="31" y="78">y₁(t)</text><text class="math" x="165" y="213">yₙ(t)</text>
  <path class="flow" d="M235 142h57"/>
  <rect class="box" x="308" y="64" width="176" height="156" rx="12"/>
  <text class="box-title" x="396" y="119" text-anchor="middle">INFERENCE</text><text class="box-note" x="396" y="151" text-anchor="middle">dynamics + graph theory</text><text class="box-note" x="396" y="176" text-anchor="middle">limited measurements</text>
  <path class="flow" d="M500 142h50"/><text class="label" x="635" y="34" text-anchor="middle">ESTIMATED Ĝ</text>
  <!-- Directed weighted graph; arrowheads encode direction, line weight encodes coupling strength. -->
  <path class="edge" d="M581 85 643 66M651 75 691 121M684 134 663 202M650 207 595 211M584 201 563 151M568 138 577 96M590 90 677 124M583 151 647 78M597 202 678 135"/>
  <path class="edge weak" d="M640 76 592 199M574 148 654 198"/>
  <g><circle class="node" cx="581" cy="85" r="10"/><circle class="node" cx="651" cy="70" r="10"/><circle class="node" cx="691" cy="126" r="10"/><circle class="node" cx="659" cy="207" r="10"/><circle class="node" cx="590" cy="211" r="10"/><circle class="node" cx="563" cy="144" r="10"/></g>
  <circle class="leader" cx="651" cy="70" r="8"/><circle class="leader" cx="590" cy="211" r="8"/>
  <text class="weight" x="611" y="68">ŵ₁₂</text><text class="weight" x="669" y="181">ŵ₃₄</text>
</svg>
