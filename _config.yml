# Site Settings


theme: bulma-clean-theme
remote_theme: chrisrhymes/bulma-clean-theme


title: Connect Lab
tagline: Theory for cooperative, networked, and multi-agent systems
email: dzelazo@technion.ac.il
description: >
  Theory and methods for cooperative, networked, and multi-agent systems.
baseurl: ""
url: "https://connect-lab-technion.github.io"
default_og_image: "/img/logos/Connect_logo_full.png"

twitter_username:
github_username:  connect-lab-technion


permalink: pretty

hide_share_buttons: true
theme_color: '#eeeeee'
fixed_navbar: top
#direction: _site


# paginate: 5
# paginate_path: "/research/page:num"

# Disqus Comments
disqus:
 # Leave shortname blank to disable comments site-wide.
 # Disable comments for any post by adding `comments: false` to that post's YAML Front Matter.
 # shortname: my_disqus_shortname
 shortname: connect-lab-technion




# Build settings
# theme: bulma-clean-theme
plugins:
 - jekyll-feed
 - jekyll/scholar
 - jekyll-sitemap
 - jekyll-paginate
 - jekyll-seo-tag
 #- kramdown-parser-gfm
 - jekyll-redirect-from




exclude:
 - Gemfile
 - clean-theme.gemspec
 - Gemfile.lock
 - node_modules
 - vendor/bundle/
 - vendor/cache/
 - vendor/gems/
 - vendor/ruby/
 - img/social/connect/
 - gallery_orig.md
 - gallery_v2.md
 - homepage-concept-b.md
 - docs.md
 - docs/
 - example-recipe.md
 - landing.md
 - showcase.md
 - blog/
 - _posts/2018-05-28-why-use-a-static-site-generator.markdown
 - about.markdown
 - output/
 - outputs/




sass:
 style: compressed
 source_dir: _sass


defaults:
 -
   scope:
     path: ""
     type: "pages"
   values:
     show_sidebar: true
 -
   scope:
     path: ""
     type: "posts"
   values:
     author: "Connect Lab"
     layout: post
     show_sidebar: false


markdown: kramdown
highlighter: rouge


excerpt_separator: "<!-- more -->"



collections:
  research:
    output: true
    layout: research
    show_sidebar: false
  team:
    output: true
    layout: team_member_personal_page
    show_sidebar: false
  student-projects:
    output: true
    show_sidebar: false
    layout: student_project
  news:
    output: true
    permalink: /news/:path/
    



scholar:
 # style: simple-ieee.csl
 style: _bibliography/ieee.csl 
 source: _bibliography
 bibliography_template: bib #bib_thumbnail
 bibliography: DZ_Complete.bib
 group_by: type
 type_order: [article , inproceedings, incollection, TechReport, Thesis, patent]
 sort_by: [year, month]
 order: descending
 use_raw_bibtex_entry: true

# Google Analytics
google_analytics: G-2XT08ZKN88

categories_order:
  - staff
  - postdoc
  - researcher
  - phd_students
  - master_student
  - undergraduate_students
  - visiting_students


default_bib_image: "/img/team/drone_a.jpg"

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
