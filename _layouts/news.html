---
layout: default
hide_hero: true
full_width: true
---
<article class="news-story">
  <header class="news-story__hero">
    <a href="{{ '/news_archive/' | relative_url }}">← All news</a>
    <p class="site-kicker">From the lab · {{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="news-story__body">{{ content }}</div>
  <footer class="news-story__footer"><a href="{{ '/news_archive/' | relative_url }}">Browse all lab news <span aria-hidden="true">→</span></a></footer>
</article>
