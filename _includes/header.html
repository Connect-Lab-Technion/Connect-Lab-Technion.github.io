<nav class="navbar is-primary is-fixed-{{ site.fixed_navbar }}" x-data="{ openNav: false }">
    <div class="container">
        
        <div class="navbar-brand">
            <a class="navbar-item navbar-logo" href="{{ site.baseurl }}/" aria-label="Connect Lab home">
                <img src="{{ site.baseurl }}/img/logos/Connect_logo_clean.png" alt="Connect Lab mark">
                <span class="navbar-lab-name"><strong>Connect Lab</strong><small>Cooperative Networks and Controls</small></span>
            </a>

            <div class="navbar-quick-links" aria-label="Quick navigation">
                <a href="{{ site.baseurl }}/research/">Research</a>
                <a href="{{ site.baseurl }}/current-members/">Team</a>
            </div>

            <button id="navbar-toggler" class="navbar-burger" type="button" aria-label="Open navigation" aria-controls="navbar-menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
              </button>
        </div>
           
        <div id="navbar-menu" class="navbar-menu">
            <ul> 
                <div class="navbar-start">
                <a href="{{ site.baseurl }}/" class="navbar-item {% if page.url == "/" %}is-active{% endif %}">Home</a>
                {% if site.data.navigation %}
                {% for item in site.data.navigation %}
                    <a href="{{ item.link | relative_url }}" class="navbar-item {% if item.link == page.url %}is-active{% endif %}">{{ item.name }}</a>
                {% endfor %}
                {% endif %}
                </div>
            </ul>
        </div>
    </div>
</nav>

<script>

document.addEventListener("DOMContentLoaded", function () {
  var navbarToggler = document.getElementById("navbar-toggler");
  var navbarMenu = document.getElementById("navbar-menu");

  navbarToggler.addEventListener("click", function () {
    navbarMenu.classList.toggle("open");
    navbarToggler.setAttribute("aria-expanded", navbarMenu.classList.contains("open"));
  });
});


</script>
