ZELAZO:2011:biblatex:
  summary: The invention compresses related signals by finding wavelet-coefficient sets they can share. A shared component is stored once and reused when each signal is reconstructed, reducing duplicate encoded data.
Zelazo2006a:
  summary: This patent gives a systematic construction of boundary filters for biorthogonal filter banks. The design preserves the desired analysis and synthesis behavior when a signal is finite and its left and right boundaries must be handled explicitly.
Zelazo2006b:
  summary: The method reconstructs only a requested range of a discrete signal from multirate subband coefficients. By translating the output interval into the smallest required coefficient ranges, it reduces both computation and memory access.
Sakurai2006:
  summary: The method stretches or compresses music in time by processing separate polyphase-filter-bank bands and then recombining them. Constraining the alignment of bands relative to the dominant-energy band suppresses aliasing and phase mismatch while retaining low computational cost.
Sheauwei:20130297089:
  summary: A central controller allocates power across subsystems, while local device controllers predict demand from operating requests, allocated power, and cost–utility models. Those forecasts return to the system controller so power can be coordinated before overload or inefficient load shedding occurs.
patent:20050137730:
  summary: The application separates audio into multiple frequency bands, changes the duration of each band independently, and recombines the results. The goal is higher-quality time scaling than treating the entire audio signal as one broadband waveform.
patent:20070081663:
  summary: This application divides audio into two bands with a power-complementary IIR filter bank, applies time-scale modification to each band, and recombines them. The two-band structure targets efficient duration changes with controlled reconstruction behavior.
patent:20070083377:
  figure: "/img/publications/snapshots/patent-20070083377.jpg"
  summary: The application partitions audio according to Bark bands, whose widths follow human frequency perception. Each perceptual band is time-scaled separately before synthesis, so the processing better reflects how listeners resolve sound across frequency.
