Burger2014_J:
  description: >-
    This paper introduces maximal equilibrium-independent passivity and connects the steady states of passive cooperative networks to a dual pair of convex network optimization problems. The correspondence gives physical meaning to potentials, flows, inputs, and outputs and provides a unified framework for network analysis and optimal design.

Palti2019a:
  description: >-
    This work develops a projected version of Lloyd's algorithm for coverage-control problems with constrained sensor locations. The projection step respects feasible deployment regions while retaining the centroidal structure that drives a mobile sensor network toward improved coverage.

Rist2016_J:
  description: >-
    This paper formulates economic dispatch for a single micro gas turbine operating in combined heat-and-power mode. A detailed turbine model, real heat and electricity demands, utility tariffs, and startup, shutdown, and maintenance costs are combined in a graph-based scheduling problem that identifies economically optimal operating modes.

Zelazo2023b_C:
  description: >-
    This work studies how to identify externally actuated leader agents in semi-autonomous consensus networks using distributed observations. It exploits the relationship between the network dynamics and leader-follower structure to infer the hidden leader set without requiring a centralized reconstruction of the full interaction graph.

Zhao2014b:
  description: >-
    This work studies formation control when the target shape is specified by inter-agent bearings and only bearing measurements are available. It uses bearing rigidity to characterize the admissible formation shapes and develops distributed control laws that steer the network to the desired bearing-constrained configuration.

Leiter2022:
  description: >-
    This thesis develops graph-based model-reduction methods for multi-agent and network systems. It studies graph contractions with spectral interlacing, projection-based reduced-order models and error bounds, and constructive algorithms that retain important network structure while reducing computational complexity.

Sharf2020:
  description: >-
    This thesis develops network-optimization methods for analyzing and designing passivity-based cooperative control systems. It connects equilibrium-independent passivity to convex duality, network flow and potential problems, and controller synthesis, including extensions for passivity-short agents, clustering, and network identification.

Barkai2025:
  description: >-
    This thesis studies agreement and synchronization when multi-agent communication is constrained in space and time. It develops emulation-based sampled-data protocols for asynchronous and delayed information exchange, analyzes internal-stability limits of diffusive coupling, and introduces filtered architectures that separate local regulation from network coordination.

Peleg2022:
  description: >-
    This thesis studies economic dispatch for a network of micro gas turbines operating in combined heat-and-power mode. It models unit commitment, local operating constraints, heat and electricity demands, and network coordination to obtain schedules that balance generation cost, utility exchange, and turbine limitations.

Priel2022:
  description: >-
    This thesis develops improved consensus Kalman filters for distributed sensor networks. It derives less conservative consensus gains, studies decentralized tuning from local graph information, and introduces event-triggered communication rules that reduce transmissions while preserving estimation quality and stability.

Drellich2021:
  description: >-
    This thesis designs a low-cost aerial research platform for guidance, navigation, and control. It integrates a quadcopter, modular sensors, a variable-degree-of-freedom test bench, and a Simulink-centered workflow so control and estimation algorithms can move efficiently from simulation to repeatable hardware experiments.

Palti2020:
  description: >-
    This thesis develops deployment strategies for mobile sensing and coverage-control problems. It combines graph and rigidity tools with projected optimization and Lloyd-type algorithms to coordinate sensor positions under geometric constraints while improving the covered region.

Goldenberg2019:
  description: >-
    This thesis develops a rigidity-based framework for cooperative manipulation by multiple robots. It models the coupled object-agent dynamics, relates feasible coordinated motions and internal forces to graph rigidity, and uses that structure to design distributed manipulation and force-allocation strategies.

Zelazo_TCNS26:
  figure: /img/home/merging-agents-assembly.png
  alt: Nineteen mobile modules progressively docking into a single hexagonal assembly at their initial centroid
  description: >-
    Standard consensus makes agents approach the same point but does not describe what happens when physical robots actually dock. This paper introduces a hybrid aggregating-consensus protocol: nearby agents merge their states and neighborhoods, turning each growing cluster into a clique while preserving the original sensing structure. The resulting network is a blow-up of a contracted graph, which yields order-independent guarantees that every agent merges at the initial centroid in finite time, with extensions to formation assembly, collision avoidance, and cooperative transport.

Yue_ECC27:
  figure: /img/home/equilibrium-forces-formation.png
  alt: Two formation-control examples with edges carrying sustained equilibrium stress highlighted in orange
  description: >-
    Distance-based formation controllers usually drive every edge force to zero once the target shape is reached. This paper uses transversal passivity to design dynamic edge controllers that instead preserve admissible, internally balanced equilibrium forces. It establishes a closed-loop dissipation margin and local convergence to the target formation and force manifolds, then illustrates how the chosen force subspace determines which edges remain stressed and how sparsely the controller can be implemented.

Yue_TAC26:
  figure: /img/home/transversal-passivity-paper.png
  alt: Input and output manifolds used to define the transversal supply rate
  description: >-
    Classical passivity measures dissipation relative to an equilibrium. This paper introduces transversal passivity for input and output manifolds: it penalizes only error across the target while allowing motion along it, and identifies the geometric compatibility conditions needed when such systems are interconnected.

Zelazo_ECC27:
  figure: /img/home/flatness-consensus.png
  alt: Five nonlinear agents following a common reference under an open-loop flatness input
  description: >-
    Can an entire nonlinear consensus network be steered through a single agent? The paper connects differential flatness to graph structure, showing that a measured node is a flat output precisely when the interaction graph is a path with actuation and measurement at opposite ends, enabling finite-time transitions between consensus states.

Leiter_TCNS26:
  figure: /img/home/paper-interface-reduction.png
  alt: Network system with preserved control and output interface nodes
  description: >-
    Large network models are useful only if reduction preserves the physical nodes where control and measurement occur. This work characterizes all projections that retain those interfaces, derives stability and H-infinity error guarantees, and demonstrates sparse, accurate coarse models on a 65,566-state chip thermal network.

Theran_TAC26:
  figure: /img/home/paper-edge-dynamics.png
  alt: Geometric relationship between formation configurations and edge measurements
  description: >-
    The paper moves distance-based formation stability from agent coordinates into edge space. It shows that directed-sensing stability depends jointly on graph orientation and target geometry, that persistence is neither necessary nor sufficient for convergence, and develops spectral tests and an optimization method for stabilizing edge gains.

GoldgraberCasspi_LCSS26:
  figure: /img/home/paper-transmission-polygon.png
  alt: Global transmission polygon and zero-transmission loci for a four-agent formation
  description: >-
    A formation's geometry can make a disturbance applied at one agent invisible at another. For rigid formations, this paper turns those signal-blocking configurations into explicit geometric boundaries and introduces a global transmission polygon—a practical sensor-placement rule that avoids steady-state blind spots.

Matmon2026_ECC:
  figure: /img/home/paper-leader-identification.png
  alt: Sensing graph with identified leader nodes highlighted in green
  description: >-
    This work asks whether hidden leaders in a consensus network can be found from motion alone. By relating steady-state agent velocities to the Fiedler vector, it develops a data-driven method that identifies the leader set without knowing the network topology.
